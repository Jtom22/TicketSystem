spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/db_ticketsystem
spring.datasource.username=root
spring.datasource.password=sasa1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 1. Fuerza a Hibernate a verificar que las entidades coincidan EXACTAMENTE con las tablas de la BD
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Muestra en la consola de tu IDE todas las consultas SQL que Spring intenta hacer
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Muestra los valores reales de los parámetros en las consultas (útil para auditoría y fechas)
logging.level.org.hibernate.orm.jdbc.bind=trace


spring.flyway.baseline-on-migrate=true