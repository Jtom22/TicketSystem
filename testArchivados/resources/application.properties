# Configuración SOLO para tests. Nunca se usa en producción ni en local real
# (esa vive en src/main/resources/application.properties, que está en
# .gitignore a propósito). Esta sí se sube al repo porque no tiene secretos
# reales, y es lo que permite que los tests corran en cualquier máquina
# (o en CI) sin necesitar MySQL instalado.

# Base de datos en memoria: se crea vacía al arrancar los tests y se
# destruye al terminar. Ningún test toca tu base de datos MySQL real.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Valores de ejemplo para JWT — solo para que el contexto de Spring
# arranque en los tests, nunca se usan para nada real.
jwt.secret=CLAVE_DE_TEST_SOLO_PARA_QUE_ARRANQUEN_LOS_TESTS
jwt.expiration-ms=3600000